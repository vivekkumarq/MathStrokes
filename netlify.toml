# =====================================================================================
# Netlify hosts the Angular app. Netlify cannot run the Spring Boot backend - it serves
# static files and edge functions only - so the API lives on a container host and Netlify
# proxies through to it.
#
# The backend runs on Antideploy as `iota-api`, with Render kept as a rollback.
#
# The hostname lives in TWO places, not one: the /api/* rule below, and apiBaseUrl in
# frontend/src/environments/environment.prod.ts. Production uses the second - the bundle calls
# the backend directly, because Netlify's proxy times out at ~29s and a cold JVM boot is longer
# than that. Changing only this file moves nothing. Change both.
# =====================================================================================

[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"
  # Angular's CLI analytics prompt would otherwise stall a non-interactive build.
  NG_CLI_ANALYTICS = "false"

# -------------------------------------------------------------------------------------
# API proxy.
#
# Kept, but NOT what production uses. The bundle calls the backend directly - see the comment
# in environment.prod.ts for why: Netlify's proxy gives up at ~29s and a cold JVM boot takes
# longer, which turned every request to a sleeping backend into a 504.
#
# It stays here because it is still the right shape for anything served same-origin, and
# because leaving a stale hostname in it is how the two copies drift apart.
#
# Placed BEFORE the SPA fallback: Netlify applies rules in order, and the catch-all below
# would otherwise swallow API calls and return index.html.
# -------------------------------------------------------------------------------------
[[redirects]]
  from   = "/api/*"
  to     = "https://iota-api.antideploy.com/api/:splat"
  status = 200
  force  = true

# -------------------------------------------------------------------------------------
# SPA fallback. The router uses real paths, so a refresh on /exam/12 or a shared link to
# /results/7 must serve index.html rather than 404.
# -------------------------------------------------------------------------------------
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# -------------------------------------------------------------------------------------
# Headers. The API sets its own; these cover the documents and assets Netlify serves.
# -------------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options   = "nosniff"
    X-Frame-Options          = "DENY"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Hashed build artefacts are immutable, so they can be cached hard.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached, or a deploy leaves browsers on the old bundle.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
