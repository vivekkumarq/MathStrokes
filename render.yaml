# =====================================================================================
# Render blueprint for the iota API.
#
# Netlify serves the Angular app; it cannot run a JVM. This deploys the backend container
# that Netlify's /api/* proxy points at.
#
# Render is one option among several - Railway, Fly.io and Koyeb all take the same
# Dockerfile. Nothing in the application is tied to a provider: it is a plain container
# configured entirely through environment variables.
#
# FIRST DEPLOY: Render > New > Blueprint > point at this repository.
# =====================================================================================

services:
  - type: web
    name: iota-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore          # closest to the intended users; change if yours differ
    healthCheckPath: /api/actuator/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Generated once by Render and then held. Rotating it signs everybody out, which is
      # the correct behaviour if it ever leaks.
      - key: JWT_SECRET
        generateValue: true

      # Wired automatically from the database declared below. The app accepts Render's
      # postgresql://user:pass@host/db form directly and derives the JDBC URL and credentials
      # from it, so there is nothing to copy out of the dashboard by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: iota-db
          property: connectionString

      # The Netlify site origin. Requests arriving through the Netlify proxy are same-origin and
      # never preflight, so this only matters for a browser calling the API directly.
      - key: CORS_ALLOWED_ORIGINS
        value: https://mathstrokes.netlify.app

      # First boot only. Set these three, deploy, sign in, change the password, then set
      # SEED_ENABLED to false. The seeder refuses to invent a default password, so leaving
      # them unset simply means no admin is created.
      - key: SEED_ENABLED
        value: "true"
      - key: SEED_ADMIN_NAME
        value: Vivek Kumar
      - key: SEED_ADMIN_PHONE
        value: "9000000001"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_SECURITY_QUESTION
        value: In which city were you born?
      - key: SEED_ADMIN_SECURITY_ANSWER
        sync: false

      - key: SWAGGER_ENABLED
        value: "false"

      # Free tiers cap connections tightly; 5 leaves room for the platform's own probes.
      - key: DB_POOL_MAX
        value: "5"

databases:
  - name: iota-db
    plan: free
    databaseName: mathstrokes
    user: mathstrokes
    region: singapore
