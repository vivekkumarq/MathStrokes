# =====================================================================================
# Render blueprint for the iota API.
#
# Netlify serves the Angular app; it cannot run a JVM. This deploys the backend container
# that Netlify's /api/* proxy points at.
#
# Render is one option among several - Railway, Fly.io and Koyeb all take the same
# Dockerfile. Nothing in the application is tied to a provider: it is a plain container
# configured entirely through environment variables.
#
# FIRST DEPLOY: Render > New > Blueprint > point at this repository.
# =====================================================================================

services:
  - type: web
    name: iota-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore          # closest to the intended users; change if yours differ
    healthCheckPath: /api/actuator/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Generated once by Render and then held. Rotating it signs everybody out, which is
      # the correct behaviour if it ever leaks.
      - key: JWT_SECRET
        generateValue: true

      # Set in the dashboard, not here. The database now lives on Neon, outside Render, so
      # there is no Render database left to wire this from. `sync: false` means the blueprint
      # leaves whatever is set on the service alone instead of overwriting it on every sync -
      # without it, the next sync would quietly point production back at the old database.
      #
      # The value is a libpq URL; DatabaseUrlEnvironmentPostProcessor derives the JDBC URL and
      # the credentials from it. Do not include channel_binding - that is a libpq option and
      # the JDBC driver does not understand it.
      - key: DATABASE_URL
        sync: false

      # The Netlify site origin. Requests arriving through the Netlify proxy are same-origin and
      # never preflight, so this only matters for a browser calling the API directly.
      - key: CORS_ALLOWED_ORIGINS
        value: https://iota-jee.netlify.app

      # First boot only. Set these three, deploy, sign in, change the password, then set
      # SEED_ENABLED to false. The seeder refuses to invent a default password, so leaving
      # them unset simply means no admin is created.
      - key: SEED_ENABLED
        value: "false"
      - key: SEED_ADMIN_NAME
        value: Vivek Kumar
      - key: SEED_ADMIN_PHONE
        value: "9000000001"
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_SECURITY_QUESTION
        value: In which city were you born?
      - key: SEED_ADMIN_SECURITY_ANSWER
        sync: false

      - key: SWAGGER_ENABLED
        value: "false"

      # Free tiers cap connections tightly; 5 leaves room for the platform's own probes.
      - key: DB_POOL_MAX
        value: "5"

      # The free instance is CPU-throttled. At strength 12 a single login took over six seconds
      # and timed out entirely on a cold start. 10 is Spring Security's own default and brings
      # it under a second. Raise this on a paid instance.
      - key: BCRYPT_STRENGTH
        value: "10"

# Kept deliberately. This is the database production ran on until the move to Neon, and it is
# the rollback: putting the old DATABASE_URL back on the service restores service immediately.
# Removing it from here would let a blueprint sync delete it, so it stays until Neon has served
# real traffic. Render deletes it on its own after the free plan expires on 29 September 2026.
databases:
  - name: iota-db
    plan: free
    databaseName: mathstrokes
    user: mathstrokes
    region: singapore
