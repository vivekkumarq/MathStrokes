spring:
  application:
    name: mathstrokes
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mathstrokes}
    username: ${DATABASE_USERNAME:mathstrokes}
    password: ${DATABASE_PASSWORD:mathstrokes}
    hikari:
      pool-name: mathstrokes-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Off because the seed migrations embed JSON, and Flyway would read every '${' in that
    # payload as one of its own placeholders and refuse to run. We use no Flyway placeholders.
    placeholder-replacement: false
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        # Spring's own ceiling is 2000. A client asking for a page that large is either a bug or
        # an attempt to pull the whole bank in one request; neither needs serving.
        max-page-size: 100
        default-page-size: 20
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  # Deployed behind a TLS-terminating proxy, so honour X-Forwarded-Proto and X-Forwarded-For.
  # Without this Spring believes every request arrived over plain HTTP and omits HSTS.
  forward-headers-strategy: framework
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

mathstrokes:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P7D}
    password-reset-token-expiration: ${JWT_PASSWORD_RESET_TOKEN_EXPIRATION:PT10M}
    issuer: mathstrokes
  security:
    # Each step doubles the hashing cost. 12 suits a real CPU; a throttled shared instance
    # needs 10 or a single login can outlast the gateway timeout.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  app:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    seed:
      enabled: ${SEED_ENABLED:true}
      admin-full-name: ${SEED_ADMIN_NAME:Platform Administrator}
      admin-phone-number: ${SEED_ADMIN_PHONE:}
      admin-password: ${SEED_ADMIN_PASSWORD:}
      admin-security-question: ${SEED_ADMIN_SECURITY_QUESTION:What is your favourite mathematical constant?}
      admin-security-answer: ${SEED_ADMIN_SECURITY_ANSWER:}
    exam:
      default-duration-minutes: 60
      default-question-count: 25
      # How often the sweep finalises attempts whose clock has run out, milliseconds.
      expiry-sweep-interval-ms: ${EXPIRY_SWEEP_INTERVAL_MS:30000}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:300}

logging:
  level:
    com.mathstrokes: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
