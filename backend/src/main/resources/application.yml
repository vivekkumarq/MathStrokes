spring:
  application:
    name: mathstrokes
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mathstrokes}
    username: ${DATABASE_USERNAME:mathstrokes}
    password: ${DATABASE_PASSWORD:mathstrokes}
    hikari:
      pool-name: mathstrokes-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

mathstrokes:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P7D}
    password-reset-token-expiration: ${JWT_PASSWORD_RESET_TOKEN_EXPIRATION:PT10M}
    issuer: mathstrokes
  app:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    seed:
      enabled: ${SEED_ENABLED:true}
      admin-full-name: ${SEED_ADMIN_NAME:Platform Administrator}
      admin-phone-number: ${SEED_ADMIN_PHONE:}
      admin-password: ${SEED_ADMIN_PASSWORD:}
      admin-security-question: ${SEED_ADMIN_SECURITY_QUESTION:What is your favourite mathematical constant?}
      admin-security-answer: ${SEED_ADMIN_SECURITY_ANSWER:}
    exam:
      default-duration-minutes: 60
      default-question-count: 25
      submission-grace-seconds: 5
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:300}

logging:
  level:
    com.mathstrokes: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
